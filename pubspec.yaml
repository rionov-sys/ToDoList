name: chronos_todolist
description: "Chronos - Todo List with Timeline Tracking & Kinetic Focus OS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2

  # Date & Time Utilities
  intl: ^0.20.3

  # Networking & HTTP (Production ready)
  dio: ^5.4.3+1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Icons & Aesthetics
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
